[package]
name = "fl-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "FerroWire: durable agent messaging with lasting agent IRIs, per-agent mailboxes with receipts, a local Unix-socket daemon, a WebSocket/TLS peer relay, and native push delivery to five coding-agent CLIs."
repository = "https://github.com/Artificial-Humanity/FerroWire"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
fl-core = { git = "https://github.com/Artificial-Humanity/FerroLoop.git" }
fl-store = { git = "https://github.com/Artificial-Humanity/FerroLoop.git" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
webpki-roots = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
